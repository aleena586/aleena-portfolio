<!DOCTYPE html>
<html>
<head>
    <title>Beautiful Flowers</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff0f5;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #e88ca5;
            color: white;
            padding: 20px;
        }

        h2 {
            color: #c65378;
        }

        .flowers {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .flowers img {
            width: 200px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        footer {
            background-color: #e88ca5;
            color: white;
            padding: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Beautiful Flowers 🌸</h1>
        <p>Welcome to my flower gallery</p>
    </header>

    <h2>Nature's Beauty</h2>

    <p>
        Flowers make our world beautiful.
        They bring happiness, colors and freshness to our lives.
    </p>

    <div class="flowers">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=400"
             alt="Pink flowers">

        <img src="https://images.unsplash.com/photo-1494972308805-463bc619d34e?w=400"
             alt="Beautiful flower">

        <img src="https://images.unsplash.com/photo-1520763185298-1b434c919102?w=400"
             alt="Colorful flowers">
    </div>

    <footer>
        <p>Created by Aleena | My First Web Project</p>
    </footer>

</body>
</html>
